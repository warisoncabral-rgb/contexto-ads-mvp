openapi: 3.1.0
info:
  title: Contexto Ads Generator Integration V1
  version: 1.0.4
  description: >-
    GPT-compatible no-write integration. The GPT may discover its authorized tenant and
    selected Meta target before submitting Campaign Package V1. No operation in this
    contract authorizes Meta delivery, spend, activation or external writes.
servers:
  - url: https://contexto-ads-validation-api.onrender.com/v1
security:
  - bearerAuth: []
paths:
  /operator/tenants:
    get:
      operationId: listAuthorizedTenants
      summary: Discover authorized tenants for the authenticated operator
      description: >-
        Read-only. Use when tenantId is not already known. Match the current business/client
        to an authorized tenant before handoff. Performs no Meta write.
      responses:
        '200': { description: Authorized tenant list }
        '401': { description: Authentication denied }

  /operator/tenants/{tenantId}/meta/selected-execution-target:
    get:
      operationId: getSelectedExecutionTarget
      summary: Resolve the selected Meta target for a tenant
      description: >-
        Read-only. Returns the selected connectionId, adAccountId and selected Page/WhatsApp
        assets. Use these values to populate the Campaign Package technical target fields.
        Performs no Meta write.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Selected Meta execution target }
        '401': { description: Authentication denied }
        '404': { description: No selected target }

  /operator/tenants/{tenantId}/campaign-packages/v1/submit:
    post:
      operationId: submitCampaignPackage
      summary: Submit a completed Campaign Package V1
      description: >-
        Validates and persists the handoff. Performs no Meta write. If technical target IDs
        are not known, call listAuthorizedTenants and getSelectedExecutionTarget first.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignPackageV1' }
      responses:
        '201': { description: Handoff accepted }
        '400': { description: Malformed request }
        '401': { description: Authentication denied }
        '409': { description: Conflict or unresolved precondition }

  /operator/tenants/{tenantId}/campaign-packages/v1/{packageId}/status:
    get:
      operationId: getCampaignPackageStatus
      summary: Get current package status
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: packageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Current status }
        '401': { description: Authentication denied }
        '404': { description: Package not found }

  /operator/tenants/{tenantId}/campaigns/{campaignId}/plans/{executionPlanId}/creative-packages:
    post:
      operationId: submitReviewedCreativePackage
      summary: Submit reviewed creative content
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: executionPlanId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [creative]
              properties:
                creative: { $ref: '#/components/schemas/CreativePackageInputV1' }
      responses:
        '201': { description: Creative version created }
        '400': { description: Invalid payload }
        '401': { description: Authentication denied }
        '404': { description: Plan not found }
        '409': { description: Conflict }

  /operator/tenants/{tenantId}/campaigns/{campaignId}/creative-packages/latest:
    get:
      operationId: getLatestCreativePackage
      summary: Get latest creative package
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Latest creative package }
        '401': { description: Authentication denied }
        '404': { description: Not found }

  /operator/tenants/{tenantId}/campaigns/{campaignId}/creative-packages/{version}/approve:
    post:
      operationId: approveCreativePackage
      summary: Approve exact creative version
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contentHash]
              properties:
                contentHash: { type: string }
      responses:
        '201': { description: Creative approved }
        '400': { description: Invalid request }
        '401': { description: Authentication denied }
        '409': { description: Stale creative }

  /operator/tenants/{tenantId}/campaigns/{campaignId}/plans/{executionPlanId}/approvals:
    post:
      operationId: requestExecutionPlanApproval
      summary: Request approval for the current plan
      description: Requesting approval does not execute the plan and performs no Meta write.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: executionPlanId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Approval requested }
        '401': { description: Authentication denied }
        '404': { description: Plan not found }
        '409': { description: Plan stale }

  /operator/tenants/{tenantId}/approvals/{approvalId}:
    get:
      operationId: getExecutionPlanApproval
      summary: Get current plan approval
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: approvalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Approval state }
        '401': { description: Authentication denied }
        '404': { description: Approval not found }

  /operator/tenants/{tenantId}/approvals/{approvalId}/{decision}:
    post:
      operationId: decideExecutionPlanApproval
      summary: Record explicit plan approval decision
      description: >-
        Approve, reject or revoke. An approved plan is not an execution authorization and
        this operation performs no Meta write.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: approvalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: decision
          in: path
          required: true
          schema: { type: string, enum: [approve, reject, revoke] }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string }
      responses:
        '201': { description: Decision recorded }
        '400': { description: Invalid decision }
        '401': { description: Authentication denied }
        '404': { description: Approval not found }
        '409': { description: Invalid transition }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CampaignPackageV1:
      type: object
      additionalProperties: false
      required: [package_id, package_version, created_at, source, client_id, business_name, business_description, offer_name, offer_description, offer_type, campaign_objective, conversion_destination, campaign_goal_description, audience_description, locations, budget_type, budget_amount, currency, duration_days, ads, media, strategy_status, handoff_status, meta_connection_id]
      properties:
        package_id: { type: string, format: uuid }
        package_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        source: { type: string, enum: [contexto_ads] }
        client_id: { type: string }
        business_name: { type: string }
        business_description: { type: string }
        offer_name: { type: string }
        offer_description: { type: string }
        offer_type: { type: string, enum: [product, service, catalog, promotion, lead_generation] }
        commercial_conditions: { type: object, additionalProperties: true }
        campaign_objective: { type: string, enum: [LEADS] }
        conversion_destination: { type: string, enum: [WHATSAPP] }
        campaign_goal_description: { type: string }
        audience_description: { type: string }
        locations:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [city, country]
            properties:
              city: { type: string }
              state: { type: string }
              country: { type: string }
              radius_km: { type: number, exclusiveMinimum: 0 }
              include: { type: boolean }
        age_min: { type: integer }
        age_max: { type: integer }
        gender: { type: string, enum: [all, male, female] }
        targeting_notes: { type: object, additionalProperties: true }
        budget_type: { type: string, enum: [DAILY, LIFETIME] }
        budget_amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string }
        duration_days: { type: integer, minimum: 1 }
        start_date: { type: string }
        end_date: { type: string }
        ads:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [ad_reference, primary_text, headline, cta, initial_message, media_id]
            properties:
              ad_reference: { type: string }
              primary_text: { type: string }
              headline: { type: string }
              description: { type: string }
              cta: { type: string, enum: [WHATSAPP_MESSAGE] }
              initial_message: { type: string }
              media_id: { type: string }
        media:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [media_id, media_type, source, file_reference, checksum, mime_type, width, height]
            properties:
              media_id: { type: string }
              media_type: { type: string, enum: [image] }
              source: { type: string }
              file_reference: { type: string }
              checksum: { type: string, pattern: '^(sha256:)?[0-9a-fA-F]{64}$' }
              mime_type: { type: string, enum: [image/jpeg, image/png] }
              width: { type: integer, minimum: 1 }
              height: { type: integer, minimum: 1 }
        constraints: { type: object, additionalProperties: true }
        strategy_notes: { type: object, additionalProperties: true }
        strategy_status: { type: string, enum: [COMPLETE] }
        handoff_status: { type: string, enum: [READY_FOR_GENERATOR] }
        ad_account_id: { type: string }
        facebook_page_id: { type: string }
        instagram_account_id: { type: string }
        whatsapp_asset_id: { type: string }
        meta_connection_id: { type: string, format: uuid }

    CreativePackageInputV1:
      type: object
      additionalProperties: false
      required: [copies, claims, assets, reviewChecklist]
      properties:
        copies:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [copyId, primaryText, headline, whatsappMessage, callToAction]
            properties:
              copyId: { type: string }
              primaryText: { type: string }
              headline: { type: string }
              description: { type: string }
              whatsappMessage: { type: string }
              callToAction: { type: string, enum: [SEND_WHATSAPP_MESSAGE] }
        claims:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [claimId, text, sourceRefs]
            properties:
              claimId: { type: string }
              text: { type: string }
              sourceRefs: { type: array, items: { type: string } }
        assets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [assetId, storageRef, sha256, mimeType, width, height]
            properties:
              assetId: { type: string }
              storageRef: { type: string }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
              mimeType: { type: string, enum: [image/jpeg, image/png] }
              width: { type: integer }
              height: { type: integer }
        reviewChecklist:
          type: object
          additionalProperties: false
          required: [claimsVerifiedAgainstSources, visualFidelityReviewed, safeAreaReviewed, requiredFieldsReviewed, automaticEnhancementsReviewed]
          properties:
            claimsVerifiedAgainstSources: { type: boolean }
            visualFidelityReviewed: { type: boolean }
            safeAreaReviewed: { type: boolean }
            requiredFieldsReviewed: { type: boolean }
            automaticEnhancementsReviewed: { type: boolean }
