openapi: 3.1.0
info:
  title: Contexto Ads Gerador ChatGPT Compatible
  version: 1.0.28-chatgpt-compatible
  description: Fluxo end-to-end com POSTs simples, schemas inline, autenticacao Bearer e compatibilidade com o editor de GPT Actions.
servers:
  - url: https://contexto-ads-validation-api.onrender.com/v1
security:
  - bearerAuth: []
paths:
  /operator/transport-post-ping:
    post:
      operationId: testGeneratorTransportPost
      summary: Testar transporte POST
      security: []
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [probe]
              properties:
                probe:
                  type: string
                  enum: [ok]
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_status: { type: string }
                  service: { type: string }
                  authenticated: { type: boolean }
                  probe: { type: string }
                  boundaries:
                    type: object
                    properties:
                      publication_authorized: { type: boolean }
                      external_writes_allowed: { type: boolean }
                      external_writes_performed: { type: boolean }
                      meta_write_performed: { type: boolean }

  /operator/action-post-ping:
    post:
      operationId: testGeneratorAuthenticatedPost
      summary: Testar POST autenticado
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [probe]
              properties:
                probe:
                  type: string
                  enum: [ok]
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_status: { type: string }
                  service: { type: string }
                  authenticated: { type: boolean }
                  probe: { type: string }
                  authorized_tenant_count: { type: integer }
                  boundaries:
                    type: object
                    properties:
                      publication_authorized: { type: boolean }
                      external_writes_allowed: { type: boolean }
                      external_writes_performed: { type: boolean }
                      meta_write_performed: { type: boolean }

  /operator/campaign-strategies/v1/action-submit:
    post:
      operationId: submitCampaignPackage
      summary: Enviar estrategia final aprovada ao Gerador
      description: Use somente a aprovacao explicita mais recente. Nao solicite tenantId, client_id, checksum, MIME, largura ou altura ao usuario.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approval_basis, business_name, offer_name, offer_description, campaign_objective, conversion_destination, audience_description, locations, budget_type, budget_amount, currency, duration_days, strategy_status, handoff_status]
              properties:
                approval_basis: { type: string, enum: [LATEST_EXPLICIT_CONVERSATION_APPROVAL] }
                business_name: { type: string }
                business_description: { type: string }
                offer_name: { type: string }
                offer_description: { type: string }
                commercial_conditions:
                  type: object
                  additionalProperties: true
                campaign_objective: { type: string, enum: [LEADS] }
                conversion_destination: { type: string, enum: [WHATSAPP] }
                campaign_goal_description: { type: string }
                audience_description: { type: string }
                locations:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [city, country]
                    properties:
                      city: { type: string }
                      state: { type: string }
                      country: { type: string }
                      radius_km: { type: number, exclusiveMinimum: 0 }
                      include: { type: boolean }
                budget_type: { type: string, enum: [DAILY, LIFETIME] }
                budget_amount: { type: number, exclusiveMinimum: 0 }
                currency: { type: string }
                duration_days: { type: integer, minimum: 1, maximum: 365 }
                creative_brief: { type: string }
                strategy_notes:
                  type: object
                  additionalProperties: true
                strategy_status: { type: string, enum: [COMPLETE] }
                handoff_status: { type: string, enum: [READY_FOR_GENERATOR] }
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_status: { type: string }
                  package_id: { type: string }
                  campaign_id: { type: string }
                  execution_plan_id: { type: string }
                  creative_package_status: { type: string }
                  target_binding_status: { type: string }
                  idempotency_status: { type: string }
                  next_action: { type: string }
                  boundaries:
                    type: object
                    additionalProperties: true
                    properties:
                      persisted: { type: boolean }
                      creative_package_persisted: { type: boolean }
                      execution_plan_created: { type: boolean }
                      technical_target_auto_resolved: { type: boolean }
                      publication_authorized: { type: boolean }
                      external_writes_allowed: { type: boolean }
                      external_writes_performed: { type: boolean }
                      meta_write_performed: { type: boolean }
                      spend_authorized: { type: boolean }
                      delivery_authorized: { type: boolean }
                  error:
                    type: object
                    additionalProperties: true
                    properties:
                      code: { type: string }
                      message: { type: string }

  /operator/campaign-packages/v1/action-status:
    post:
      operationId: recoverCampaignPackageStatus
      summary: Recuperar pacote persistido
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [package_id]
              properties:
                package_id: { type: string }
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_status: { type: string }
                  package_id: { type: string }
                  campaign_id: { type: string }
                  execution_plan_id: { type: string }
                  next_action: { type: string }
                  boundaries:
                    type: object
                    additionalProperties: true
                    properties:
                      publication_authorized: { type: boolean }
                      external_writes_allowed: { type: boolean }
                      external_writes_performed: { type: boolean }
                  error:
                    type: object
                    additionalProperties: true
                    properties:
                      code: { type: string }
                      message: { type: string }

  /operator/creative-packages/v1/action-prepare:
    post:
      operationId: prepareCreativePackage
      summary: Preparar criativos e ingerir arquivos anexados
      description: O backend resolve automaticamente tenant e metadados tecnicos da midia. Nao solicite SHA-256, MIME, largura ou altura ao usuario.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [package_id, campaign_id, asset_ids, openaiFileIdRefs, copies, claims, reviewChecklist]
              properties:
                package_id: { type: string }
                campaign_id: { type: string }
                asset_ids:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string }
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: IDs dos arquivos anexados nesta conversa.
                  items: { type: string }
                copies:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [copyId, primaryText, headline, callToAction]
                    properties:
                      copyId: { type: string }
                      primaryText: { type: string }
                      headline: { type: string }
                      description: { type: string }
                      whatsappMessage: { type: string }
                      callToAction:
                        type: string
                        enum: [LEARN_MORE, SHOP_NOW, SIGN_UP, CONTACT_US, SEND_WHATSAPP_MESSAGE]
                claims:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [claimId, text, sourceRefs]
                    properties:
                      claimId: { type: string }
                      text: { type: string }
                      sourceRefs:
                        type: array
                        minItems: 1
                        maxItems: 20
                        items: { type: string }
                reviewChecklist:
                  type: object
                  additionalProperties: false
                  required: [claimsVerifiedAgainstSources, visualFidelityReviewed, safeAreaReviewed, requiredFieldsReviewed, automaticEnhancementsReviewed]
                  properties:
                    claimsVerifiedAgainstSources: { type: boolean }
                    visualFidelityReviewed: { type: boolean }
                    safeAreaReviewed: { type: boolean }
                    requiredFieldsReviewed: { type: boolean }
                    automaticEnhancementsReviewed: { type: boolean }
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_status: { type: string }
                  creative_package:
                    type: object
                    additionalProperties: true
                    properties:
                      creativePackageId: { type: string }
                      campaignId: { type: string }
                      sourceExecutionPlanId: { type: string }
                      version: { type: integer }
                      status: { type: string }
                      contentHash: { type: string }
                      validationIssues:
                        type: array
                        items: { type: string }
                  execution_plan_id: { type: string }
                  idempotency_status: { type: string }
                  media_auto_resolved: { type: boolean }
                  tenant_auto_resolved: { type: boolean }
                  next_action: { type: string }
                  boundaries:
                    type: object
                    additionalProperties: true
                    properties:
                      publication_authorized: { type: boolean }
                      external_writes_allowed: { type: boolean }
                      external_writes_performed: { type: boolean }
                      meta_write_performed: { type: boolean }
                      spend_authorized: { type: boolean }
                      delivery_authorized: { type: boolean }
                  error:
                    type: object
                    additionalProperties: true
                    properties:
                      code: { type: string }
                      message: { type: string }

  /operator/creative-packages/v1/action-review:
    post:
      operationId: reviewCreativePackage
      summary: Ler Creative Package atual
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [package_id]
              properties:
                package_id: { type: string }
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_status: { type: string }
                  creative_package:
                    type: object
                    additionalProperties: true
                    properties:
                      creativePackageId: { type: string }
                      campaignId: { type: string }
                      sourceExecutionPlanId: { type: string }
                      version: { type: integer }
                      status: { type: string }
                      contentHash: { type: string }
                      validationIssues:
                        type: array
                        items: { type: string }
                  execution_plan_id: { type: string }
                  next_action: { type: string }
                  boundaries:
                    type: object
                    additionalProperties: true
                    properties:
                      publication_authorized: { type: boolean }
                      external_writes_allowed: { type: boolean }
                      external_writes_performed: { type: boolean }
                  error:
                    type: object
                    additionalProperties: true
                    properties:
                      code: { type: string }
                      message: { type: string }

  /operator/campaigns/v1/action-final-review:
    post:
      operationId: getFinalCampaignReview
      summary: Mostrar revisao final de negocio
      description: Apresente ao usuario apenas direcionamento e publico, oferta e logistica, textos e criativos, orcamento e duracao, e orientacao de cobranca.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [package_id]
              properties:
                package_id: { type: string }
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_status: { type: string }
                  package_id: { type: string }
                  campaign_id: { type: string }
                  execution_plan_id: { type: string }
                  final_review:
                    type: object
                    additionalProperties: true
                    properties:
                      review_hash: { type: string }
                      business: { type: string }
                      objective: { type: string }
                      direction: { type: string }
                      audience: { type: string }
                      offer_and_logistics: { type: string }
                      budget:
                        type: object
                        additionalProperties: true
                        properties:
                          mode: { type: string }
                          amount: { type: number }
                          currency: { type: string }
                          duration_days: { type: integer }
                          maximum_planned_amount: { type: number }
                      creatives:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      billing:
                        type: object
                        additionalProperties: true
                        properties:
                          planned_total: { type: number }
                          currency: { type: string }
                          instruction: { type: string }
                  confirmation_items:
                    type: array
                    items: { type: string }
                  next_action: { type: string }
                  boundaries:
                    type: object
                    additionalProperties: true
                    properties:
                      publication_authorized: { type: boolean }
                      external_writes_allowed: { type: boolean }
                      external_writes_performed: { type: boolean }
                      meta_write_performed: { type: boolean }
                      spend_authorized: { type: boolean }
                      delivery_authorized: { type: boolean }
                  error:
                    type: object
                    additionalProperties: true
                    properties:
                      code: { type: string }
                      message: { type: string }

  /operator/campaigns/v1/action-finalize-for-publication:
    post:
      operationId: finalizeCampaignForPublication
      summary: Criar e validar campanha real em PAUSED
      description: Execute somente depois de aprovacao explicita da revisao final atual. Cria e valida objetos reais na Meta em PAUSED, sem entrega e sem gasto.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [package_id, review_hash, confirmation]
              properties:
                package_id: { type: string }
                review_hash: { type: string }
                confirmation: { type: string, enum: [CONFIRM_AND_PREPARE_FOR_PUBLICATION] }
                validation_mode: { type: string, enum: [PAUSED_ONLY, FULL_ROUNDTRIP] }
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_status: { type: string }
                  package_id: { type: string }
                  campaign_id: { type: string }
                  ready_hash: { type: string }
                  meta_validation_status: { type: string }
                  meta_objects:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        object_type: { type: string }
                        external_object_id: { type: string }
                        observed_status: { type: string }
                  next_action: { type: string }
                  human_message: { type: string }
                  boundaries:
                    type: object
                    additionalProperties: true
                    properties:
                      publication_authorized: { type: boolean }
                      campaign_active: { type: boolean }
                      delivery_authorized: { type: boolean }
                      spend_authorized: { type: boolean }
                      external_writes_performed: { type: boolean }
                      all_created_objects_validated_paused: { type: boolean }
                  error:
                    type: object
                    additionalProperties: true
                    properties:
                      code: { type: string }
                      message: { type: string }

  /operator/campaigns/v1/action-publish:
    post:
      operationId: publishCampaign
      summary: Ativar campanha previamente validada
      description: Execute somente quando o usuario der comando explicito de publicacao. Esta operacao pode iniciar entrega e gasto.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [package_id, confirmation]
              properties:
                package_id: { type: string }
                confirmation: { type: string, enum: [PUBLISH_CAMPAIGN] }
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_status: { type: string }
                  package_id: { type: string }
                  campaign_id: { type: string }
                  human_message: { type: string }
                  boundaries:
                    type: object
                    additionalProperties: true
                    properties:
                      publication_authorized: { type: boolean }
                      campaign_active: { type: boolean }
                      delivery_authorized: { type: boolean }
                      spend_authorized: { type: boolean }
                      external_writes_performed: { type: boolean }
                  error:
                    type: object
                    additionalProperties: true
                    properties:
                      code: { type: string }
                      message: { type: string }

components:
  schemas:
    CompatibilityMarker:
      type: object
      additionalProperties: false
      properties:
        compatible:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
