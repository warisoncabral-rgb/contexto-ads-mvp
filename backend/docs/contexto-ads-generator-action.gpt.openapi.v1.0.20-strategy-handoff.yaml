openapi: 3.1.0
info:
  title: Contexto Ads Generator Strategy Handoff
  version: 1.0.20-strategy-handoff
  description: >-
    Automatic Contexto Ads to Generator handoff for an approved campaign strategy.
    When strategy_status is COMPLETE and handoff_status is READY_FOR_GENERATOR,
    call submitCampaignPackage before telling the user the campaign is finished.
    Submit the approved strategy facts that are available in the conversation.
    Do not block the handoff because package IDs, client IDs, final ad copy, file checksums,
    MIME metadata or media dimensions are unavailable: those are technical Generator responsibilities.
    Approved creative intent can be preserved in creative_brief and completed by the Generator later.
servers:
  - url: https://contexto-ads-validation-api.onrender.com/v1
security:
  - operatorKey: []
paths:
  /operator/campaign-strategies/v1/action-submit:
    post:
      operationId: submitCampaignPackage
      summary: Send an approved campaign strategy to the Generator
      description: >-
        Automatically submit approved strategy facts. Do not invent or wait for package IDs or media
        checksum/dimensions. The server resolves tenant/Meta target, generates identity, persists context
        and creates a paused plan. Creative completion is separate. No Meta write or spend.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovedCampaignStrategyV1'
      responses:
        '200':
          description: ACCEPTED means the approved strategy was persisted by the Generator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategySubmitEnvelope'
  /operator/campaign-packages/v1/action-status:
    post:
      operationId: recoverCampaignPackageStatus
      summary: Confirm a submitted campaign in the Generator
      description: >-
        Use the exact package_id returned by submitCampaignPackage after an uncertain response or when
        confirmation is needed. FOUND confirms persistence. This operation is read-only and performs no
        Meta write.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - package_id
              properties:
                package_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Recovery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionStatusEnvelope'
components:
  securitySchemes:
    operatorKey:
      type: apiKey
      in: header
      name: X-Contexto-Operator-Key
  schemas:
    ApprovedCampaignStrategyV1:
      type: object
      additionalProperties: false
      required:
        - business_name
        - offer_name
        - offer_description
        - campaign_objective
        - conversion_destination
        - audience_description
        - locations
        - budget_type
        - budget_amount
        - currency
        - duration_days
        - strategy_status
        - handoff_status
      properties:
        business_name:
          type: string
          minLength: 1
          maxLength: 160
        business_description:
          type: string
          maxLength: 2000
        offer_name:
          type: string
          minLength: 1
          maxLength: 500
        offer_description:
          type: string
          minLength: 1
          maxLength: 2000
        commercial_conditions:
          description: Approved commercial conditions. Preserve them exactly when known.
        campaign_objective:
          type: string
          const: LEADS
        conversion_destination:
          type: string
          const: WHATSAPP
        campaign_goal_description:
          type: string
          maxLength: 2000
        audience_description:
          type: string
          minLength: 1
          maxLength: 2000
        locations:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - city
              - country
            properties:
              city:
                type: string
                minLength: 1
              state:
                type: string
              country:
                type: string
                minLength: 1
              radius_km:
                type: number
                exclusiveMinimum: 0
              include:
                type: boolean
        age_min:
          type: integer
          minimum: 18
          maximum: 65
        age_max:
          type: integer
          minimum: 18
          maximum: 65
        gender:
          type: string
          enum: [all, male, female]
        targeting_notes:
          description: Optional approved targeting notes.
        budget_type:
          type: string
          enum: [DAILY, LIFETIME]
        budget_amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        duration_days:
          type: integer
          minimum: 1
          maximum: 365
        creative_brief:
          type: string
          maxLength: 4000
          description: >-
            Preserve approved creative intent here, such as which existing video and static image should
            be used. Exact copy, checksum, width, height and other technical media metadata are not
            required for this handoff and must not be invented.
        strategy_notes:
          description: Optional approved strategy notes.
        strategy_status:
          type: string
          const: COMPLETE
        handoff_status:
          type: string
          const: READY_FOR_GENERATOR
    NoWriteBoundaries:
      type: object
      additionalProperties: true
      properties:
        publication_authorized:
          type: boolean
          const: false
        external_writes_allowed:
          type: boolean
          const: false
        external_writes_performed:
          type: boolean
          const: false
        meta_write_performed:
          type: boolean
          const: false
        spend_authorized:
          type: boolean
          const: false
        delivery_authorized:
          type: boolean
          const: false
    GenericErrorObject:
      type: object
      additionalProperties: true
      properties:
        code:
          type: string
        message:
          type: string
        statusCode:
          type: integer
    StrategySubmitEnvelope:
      type: object
      additionalProperties: true
      required:
        - action_status
      properties:
        action_status:
          type: string
          enum: [ACCEPTED, REJECTED]
        http_status:
          type: integer
        error:
          $ref: '#/components/schemas/GenericErrorObject'
        package_id:
          type: string
          format: uuid
        package_version:
          type: integer
        package_hash:
          type: string
        campaign_id:
          type: string
          format: uuid
        campaign_context_version:
          type: integer
        creative_package_id:
          type: [string, 'null']
        creative_package_status:
          type: string
        execution_plan_id:
          type: string
          format: uuid
        execution_plan_hash:
          type: string
        execution_plan_status:
          type: string
        target_binding_status:
          type: string
        next_action:
          type: string
        strategy_snapshot:
          type: object
          additionalProperties: true
        resolved_context:
          type: object
          additionalProperties: true
        boundaries:
          $ref: '#/components/schemas/NoWriteBoundaries'
    ActionStatusEnvelope:
      type: object
      additionalProperties: true
      required:
        - action_status
      properties:
        action_status:
          type: string
          enum: [FOUND, NOT_FOUND, REJECTED]
        http_status:
          type: integer
        error:
          $ref: '#/components/schemas/GenericErrorObject'
        package_id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        next_action:
          type: string
        boundaries:
          $ref: '#/components/schemas/NoWriteBoundaries'
