openapi: 3.1.0
info:
  title: Contexto Ads Generator Custom Header Diagnostic
  version: 1.0.15-custom-header
  description: Tests GPT Action authentication through a custom operator header instead of Bearer.
servers:
  - url: https://contexto-ads-validation-api.onrender.com/v1
security:
  - operatorKey: []
paths:
  /operator/action-ping:
    get:
      operationId: testGeneratorActionConnection
      summary: Test authenticated GET through custom header
      responses:
        '200':
          description: Custom-header authentication works
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPingResponse'
  /operator/action-post-ping:
    post:
      operationId: testGeneratorAuthenticatedPost
      summary: Test authenticated POST through custom header
      description: Minimal authenticated no-write POST diagnostic.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostPingRequest'
      responses:
        '200':
          description: Custom-header authenticated POST works
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPingResponse'
  /operator/campaign-packages/v1/action-status:
    post:
      operationId: recoverCampaignPackageStatus
      summary: Recover Campaign Package status
      description: Read-only status recovery using package_id in the JSON body. Performs no Meta write.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [package_id]
              properties:
                package_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Readable recovery envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionStatusEnvelope'
components:
  securitySchemes:
    operatorKey:
      type: apiKey
      in: header
      name: X-Contexto-Operator-Key
  schemas:
    NoWriteBoundaries:
      type: object
      additionalProperties: true
      properties:
        publication_authorized: { type: boolean }
        external_writes_allowed: { type: boolean }
        external_writes_performed: { type: boolean }
        meta_write_performed: { type: boolean }
    AuthPingResponse:
      type: object
      additionalProperties: false
      required: [action_status, service, schema_version, authenticated, authorized_tenant_count, boundaries]
      properties:
        action_status: { type: string, enum: [OK] }
        service: { type: string }
        schema_version: { type: string }
        authenticated: { type: boolean, enum: [true] }
        authorized_tenant_count: { type: integer, minimum: 0 }
        boundaries:
          $ref: '#/components/schemas/NoWriteBoundaries'
    PostPingRequest:
      type: object
      additionalProperties: false
      required: [probe]
      properties:
        probe:
          type: string
          enum: [ok]
    PostPingResponse:
      type: object
      additionalProperties: false
      required: [action_status, service, method, authenticated, probe, authorized_tenant_count, boundaries]
      properties:
        action_status: { type: string, enum: [OK] }
        service: { type: string }
        method: { type: string, enum: [POST] }
        authenticated: { type: boolean, enum: [true] }
        probe: { type: string, enum: [ok] }
        authorized_tenant_count: { type: integer, minimum: 0 }
        boundaries:
          $ref: '#/components/schemas/NoWriteBoundaries'
    GenericErrorObject:
      type: object
      additionalProperties: true
      properties:
        code: { type: string }
        message: { type: string }
        statusCode: { type: integer }
        packageId: { type: string }
    ActionStatusEnvelope:
      type: object
      additionalProperties: true
      required: [action_status]
      properties:
        action_status: { type: string, enum: [FOUND, NOT_FOUND, REJECTED] }
        http_status: { type: integer }
        error:
          $ref: '#/components/schemas/GenericErrorObject'
        package_id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        next_action: { type: string }
        boundaries:
          $ref: '#/components/schemas/NoWriteBoundaries'
