openapi: 3.1.0
info:
  title: Contexto Ads Generator Automatic Handoff
  version: 1.0.19-auto-handoff
  description: >-
    Operational Action contract for automatic Contexto Ads to Generator handoff.
    When strategy_status is COMPLETE and handoff_status is READY_FOR_GENERATOR,
    submit the approved Campaign Package before telling the user the campaign is finished.
servers:
  - url: https://contexto-ads-validation-api.onrender.com/v1
security:
  - operatorKey: []
paths:
  /operator/campaign-packages/v1/action-submit:
    post:
      operationId: submitCampaignPackage
      summary: Send the completed campaign to the Generator
      description: >-
        Call automatically once the campaign is complete and approved. The server resolves
        tenant and Meta technical IDs, validates and persists the package, and creates or reuses
        Generator campaign, creative-package and execution-plan state. No Meta publication or spend occurs.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignPackageV1'
      responses:
        '200':
          description: Handoff result. ACCEPTED means the package was persisted by the Generator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionSubmitEnvelope'
  /operator/campaign-packages/v1/action-status:
    post:
      operationId: recoverCampaignPackageStatus
      summary: Confirm a submitted Campaign Package in the Generator
      description: >-
        Use after an uncertain submit response or timeout. FOUND confirms that the package exists
        in the Generator. This is read-only and performs no Meta write.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [package_id]
              properties:
                package_id: { type: string, format: uuid }
      responses:
        '200':
          description: Recovery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionStatusEnvelope'
components:
  securitySchemes:
    operatorKey:
      type: apiKey
      in: header
      name: X-Contexto-Operator-Key
  schemas:
    CampaignPackageV1:
      type: object
      additionalProperties: false
      required:
        - package_id
        - package_version
        - created_at
        - source
        - client_id
        - business_name
        - business_description
        - offer_name
        - offer_description
        - offer_type
        - campaign_objective
        - conversion_destination
        - campaign_goal_description
        - audience_description
        - locations
        - budget_type
        - budget_amount
        - currency
        - ads
        - media
        - strategy_status
        - handoff_status
      properties:
        package_id: { type: string, format: uuid }
        package_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        source: { type: string, const: contexto_ads }
        client_id: { type: string, minLength: 1 }
        business_name: { type: string, minLength: 1 }
        business_description: { type: string, minLength: 1 }
        offer_name: { type: string, minLength: 1 }
        offer_description: { type: string, minLength: 1 }
        offer_type: { type: string, enum: [product, service, catalog, promotion, lead_generation] }
        commercial_conditions: {}
        campaign_objective: { type: string, const: LEADS }
        conversion_destination: { type: string, const: WHATSAPP }
        campaign_goal_description: { type: string, minLength: 1 }
        audience_description: { type: string, minLength: 1 }
        locations:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [city, country]
            properties:
              city: { type: string, minLength: 1 }
              state: { type: string }
              country: { type: string, minLength: 1 }
              radius_km: { type: number, exclusiveMinimum: 0 }
              include: { type: boolean }
        age_min: { type: integer, minimum: 18, maximum: 65 }
        age_max: { type: integer, minimum: 18, maximum: 65 }
        gender: { type: string, enum: [all, male, female] }
        targeting_notes: {}
        budget_type: { type: string, enum: [DAILY, LIFETIME] }
        budget_amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        duration_days: { type: integer, minimum: 1, maximum: 365 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        ads:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [ad_reference, primary_text, headline, cta, initial_message, media_id]
            properties:
              ad_reference: { type: string, minLength: 1 }
              primary_text: { type: string, minLength: 1 }
              headline: { type: string, minLength: 1 }
              description: { type: string }
              cta: { type: string, const: WHATSAPP_MESSAGE }
              initial_message: { type: string, minLength: 1 }
              media_id: { type: string, minLength: 1 }
        media:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [media_id, media_type, source, file_reference, checksum, mime_type, width, height]
            properties:
              media_id: { type: string, minLength: 1 }
              media_type: { type: string, enum: [image, video] }
              source: { type: string, minLength: 1 }
              file_reference: { type: string, minLength: 1 }
              checksum: { type: string, pattern: '^(sha256:)?[0-9a-fA-F]{64}$' }
              mime_type: { type: string, enum: [image/jpeg, image/png, video/mp4] }
              width: { type: integer, minimum: 1 }
              height: { type: integer, minimum: 1 }
        constraints: {}
        strategy_notes: {}
        strategy_status: { type: string, const: COMPLETE }
        handoff_status: { type: string, const: READY_FOR_GENERATOR }
    NoWriteBoundaries:
      type: object
      additionalProperties: true
      properties:
        publication_authorized: { type: boolean, const: false }
        external_writes_allowed: { type: boolean, const: false }
        external_writes_performed: { type: boolean, const: false }
        meta_write_performed: { type: boolean, const: false }
    GenericErrorObject:
      type: object
      additionalProperties: true
      properties:
        code: { type: string }
        message: { type: string }
        statusCode: { type: integer }
        packageId: { type: string }
    ActionSubmitEnvelope:
      type: object
      additionalProperties: true
      required: [action_status]
      properties:
        action_status: { type: string, enum: [ACCEPTED, REJECTED] }
        http_status: { type: integer }
        error: { $ref: '#/components/schemas/GenericErrorObject' }
        package_id: { type: string, format: uuid }
        package_version: { type: integer }
        package_hash: { type: string }
        campaign_id: { type: string, format: uuid }
        creative_package_id: { type: string, format: uuid }
        execution_plan_id: { type: string, format: uuid }
        target_binding_status: { type: string }
        next_action: { type: string }
        resolved_context: { type: object, additionalProperties: true }
        boundaries: { $ref: '#/components/schemas/NoWriteBoundaries' }
    ActionStatusEnvelope:
      type: object
      additionalProperties: true
      required: [action_status]
      properties:
        action_status: { type: string, enum: [FOUND, NOT_FOUND, REJECTED] }
        http_status: { type: integer }
        error: { $ref: '#/components/schemas/GenericErrorObject' }
        package_id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        next_action: { type: string }
        boundaries: { $ref: '#/components/schemas/NoWriteBoundaries' }
