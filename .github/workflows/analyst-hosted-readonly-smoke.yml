name: Analista Ads Hosted Readonly Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/triggers/analyst-hosted-readonly-smoke.txt

permissions:
  contents: read

jobs:
  analyst-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://contexto-ads-validation-api.onrender.com/v1
      TENANT_ID: 22222222-2222-4222-8222-222222222222
      CAMPAIGN_ID: b8f16916-cf4c-4e80-894e-dcc56fbd9564
      OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
    steps:
      - name: Require stable operator secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPERATOR_TOKEN"

      - name: Confirm API health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BASE_URL/health" > /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if (!x) process.exit(1);"

      - name: Collect Meta data without technical campaign id
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $OPERATOR_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            --data '{"since":"2026-08-30","until":"2026-08-31"}' \
            "$BASE_URL/operator/tenants/$TENANT_ID/campaigns/$CAMPAIGN_ID/analyst/collect-meta" \
            > /tmp/collect.json
          node <<'NODE'
          const x=require('/tmp/collect.json');
          if (x.action_status !== 'ANALYZED') {
            console.error(JSON.stringify({
              action_status:x.action_status,
              situation:x.situation,
              user_message:x.user_message,
              next_step:x.next_step
            }, null, 2));
            process.exit(2);
          }
          if (x.meta_campaign_resolution?.automatic !== true) throw new Error('Meta campaign was not resolved automatically');
          if (x.meta_campaign_resolution?.technical_id_required_from_user !== false) throw new Error('Technical Meta id is still required from user');
          const b=x.boundaries||{};
          if (b.meta_write_performed !== false || b.external_writes_allowed !== false || b.recommendation_auto_executed !== false || b.financial_action_authorized !== false) {
            throw new Error('Analyst safety boundaries changed');
          }
          console.log(JSON.stringify({
            action_status:x.action_status,
            resolution:x.meta_campaign_resolution,
            user_brief:x.user_brief,
            boundaries:x.boundaries
          }, null, 2));
          NODE

      - name: Read objective campaign summary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $OPERATOR_TOKEN" \
            "$BASE_URL/operator/tenants/$TENANT_ID/campaigns/$CAMPAIGN_ID/analyst/summary" \
            > /tmp/summary.json
          node <<'NODE'
          const x=require('/tmp/summary.json');
          if (x.action_status !== 'OK') throw new Error(`Unexpected summary status: ${x.action_status}`);
          for (const key of ['situation','primaryEvidence','interpretation','recommendation','nextStep','confidence','urgency','nextReviewAt']) {
            if (x[key] === undefined || x[key] === null || x[key] === '') throw new Error(`Missing objective summary field: ${key}`);
          }
          console.log(JSON.stringify(x, null, 2));
          NODE

      - name: Confirm read-only scope
        run: |
          echo "Analista hosted smoke completed with read-only Meta collection and no autonomous execution."
