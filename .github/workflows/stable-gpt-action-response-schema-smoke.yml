name: Stable GPT Action Response Schema Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/stable-gpt-action-response-schema-smoke.txt'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://contexto-ads-validation-api.onrender.com/v1
      OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
      CANONICAL_PACKAGE_ID: 849547ce-645e-4c7b-a844-451182253fe6
    steps:
      - name: Require stable operator secret
        shell: bash
        run: test -n "$OPERATOR_TOKEN"

      - name: Wait for authenticated Action ping
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            CODE=$(curl --max-time 45 --silent --show-error -D /tmp/ping.headers -o /tmp/ping.json -w '%{http_code}' \
              -H "Authorization: Bearer $OPERATOR_TOKEN" \
              "$BASE_URL/operator/action-ping" || true)
            echo "ping attempt $attempt: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/ping.json | jq .
              grep -qi '^content-type: application/json' /tmp/ping.headers
              jq -e '.action_status == "OK" and .authenticated == true and .schema_version == "1.0.8" and .boundaries.publication_authorized == false and .boundaries.external_writes_allowed == false and .boundaries.external_writes_performed == false and .boundaries.meta_write_performed == false' /tmp/ping.json >/dev/null
              exit 0
            fi
            sleep 15
          done
          cat /tmp/ping.json || true
          exit 1

      - name: Verify action recovery JSON envelope
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl --max-time 45 --silent --show-error -D /tmp/recovery.headers -o /tmp/recovery.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPERATOR_TOKEN" \
            "$BASE_URL/operator/campaign-packages/v1/$CANONICAL_PACKAGE_ID/action-status")
          echo "recovery HTTP $CODE"
          cat /tmp/recovery.json | jq .
          test "$CODE" = "200"
          grep -qi '^content-type: application/json' /tmp/recovery.headers
          jq -e '.action_status == "NOT_FOUND" and .http_status == 404 and .boundaries.publication_authorized == false and .boundaries.external_writes_allowed == false and .boundaries.external_writes_performed == false and .boundaries.meta_write_performed == false' /tmp/recovery.json >/dev/null

      - name: Confirm no Meta execution
        shell: bash
        run: echo 'Read-only Action ping and recovery only; no Meta execution, publication, activation or spend endpoint called.'
