name: Ecosystem First Pilot Creative Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/ecosystem-first-pilot-creative-diagnostic.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://contexto-ads-validation-api.onrender.com/v1
      OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
      TENANT_ID: 22222222-2222-4222-8222-222222222222
      CAMPAIGN_ID: 09cec7fc-77d0-47ae-9c77-f6250f7bd0c8
    steps:
      - name: Inspect approved creative and public asset
        run: |
          set -euo pipefail
          H="Authorization: Bearer $OPERATOR_TOKEN"
          curl --fail --silent --show-error -H "$H" \
            "$BASE_URL/operator/tenants/$TENANT_ID/campaigns/$CAMPAIGN_ID/creative-packages/latest" > /tmp/creative.json
          node <<'NODE' > /tmp/creative.env
          const x=require('/tmp/creative.json');
          const a=x.assets?.[0] || x.asset || x.creative?.assets?.[0] || x.creative?.asset;
          console.log(`STORAGE_REF=${a?.storageRef||''}`);
          console.log(`MIME_TYPE=${a?.mimeType||''}`);
          console.error(JSON.stringify({
            CREATIVE_DIAGNOSTIC:'READ_ONLY',
            status:x.status,
            version:x.version,
            asset:a?{storageRef:a.storageRef,mimeType:a.mimeType,width:a.width,height:a.height}:null,
          },null,2));
          NODE
          source /tmp/creative.env
          if [ -n "$STORAGE_REF" ]; then
            if [[ "$STORAGE_REF" == https://* ]]; then URL="$STORAGE_REF"; else URL="https://contexto-ads-validation-api.onrender.com/v1/public/media/${STORAGE_REF#/}"; fi
            code=$(curl -L --silent --show-error -o /tmp/media.bin -w '%{http_code}' "$URL" || true)
            bytes=$(wc -c < /tmp/media.bin 2>/dev/null || echo 0)
            echo "PUBLIC_ASSET_HTTP=$code BYTES=$bytes URL=$URL"
          fi
