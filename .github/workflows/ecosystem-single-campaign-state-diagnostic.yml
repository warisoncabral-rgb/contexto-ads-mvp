name: Ecosystem Single Campaign State Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/ecosystem-single-campaign-state-diagnostic.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://contexto-ads-validation-api.onrender.com/v1
      OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
      CAMPAIGN_ID: 09cec7fc-77d0-47ae-9c77-f6250f7bd0c8
    steps:
      - name: Read human and technical state
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "x-contexto-operator-key: $OPERATOR_TOKEN" \
            "$BASE_URL/operator/ecosystem/campaigns/$CAMPAIGN_ID" > /tmp/state.json
          node <<'NODE'
          const x=require('/tmp/state.json');
          console.log(JSON.stringify({
            action:'SINGLE_CAMPAIGN_STATE',
            campaignId:x.campaignId,
            activeModule:x.activeModule,
            stage:x.stage,
            headline:x.headline,
            userActionRequired:x.userActionRequired,
            userAction:x.userAction,
            technicalDetails:x.technicalDetails,
            boundaries:x.boundaries,
          },null,2));
          const b=x.boundaries||{};
          for (const k of ['publicationAuthorized','activationAuthorized','externalWritesAllowed','financialActionAuthorized','recommendationAutoExecuted']) {
            if (b[k] !== false) throw new Error(`Unsafe boundary ${k}`);
          }
          NODE
