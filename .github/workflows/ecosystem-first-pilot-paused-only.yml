name: Ecosystem First Pilot PAUSED_ONLY

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/ecosystem-first-pilot-paused-only.txt'

permissions:
  contents: read

jobs:
  paused-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://contexto-ads-validation-api.onrender.com/v1
      OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
      TENANT_ID: 22222222-2222-4222-8222-222222222222
      CAMPAIGN_ID: 09cec7fc-77d0-47ae-9c77-f6250f7bd0c8
      PLAN_ID: 2ce02f67-8b97-488d-bc53-7acbac9d26fc

    steps:
      - name: Prepare approved plan and closed manifest
        run: |
          set -euo pipefail
          H="Authorization: Bearer $OPERATOR_TOKEN"
          J="Content-Type: application/json"

          curl --fail --silent --show-error -H "$H" -H "$J" -X POST \
            "$BASE_URL/operator/tenants/$TENANT_ID/campaigns/$CAMPAIGN_ID/plans/$PLAN_ID/approvals" \
            -d '{}' > /tmp/approval.json
          APPROVAL_ID=$(node -e "const x=require('/tmp/approval.json'),a=x.approval;if(a?.status!=='approved')throw new Error('plan_not_approved:'+a?.status);if(x.boundaries?.approvalIsExecutionAuthorization!==false||x.boundaries?.publicationAuthorized!==false||x.boundaries?.externalWritesAllowed!==false)throw new Error('unsafe_plan_approval');process.stdout.write(a.approvalId)")
          echo "APPROVAL_ID=$APPROVAL_ID" >> "$GITHUB_ENV"

          curl --fail --silent --show-error -H "$H" -H "$J" -X POST \
            "$BASE_URL/operator/tenants/$TENANT_ID/campaigns/$CAMPAIGN_ID/plans/$PLAN_ID/execution-manifests" \
            -d "{\"approvalId\":\"$APPROVAL_ID\"}" > /tmp/manifest.json
          MANIFEST_ID=$(node -e "const x=require('/tmp/manifest.json');if(!x.executionManifestId)throw new Error('missing_manifest');if(x.status!=='prepared_gate_closed')throw new Error('manifest_gate_not_closed:'+x.status);if(x.boundaries?.externalWritesAllowed!==false||x.boundaries?.externalWritesPerformed!==false)throw new Error('unsafe_manifest');if((x.operations||[]).some(o=>o.intendedLifecycleStatus!=='PAUSED'))throw new Error('non_paused_manifest_operation');process.stdout.write(x.executionManifestId)")
          echo "MANIFEST_ID=$MANIFEST_ID" >> "$GITHUB_ENV"

      - name: Prepare Meta validation protocol
        run: |
          set -euo pipefail
          H="Authorization: Bearer $OPERATOR_TOKEN"
          J="Content-Type: application/json"
          curl --fail --silent --show-error -H "$H" -H "$J" -X POST \
            "$BASE_URL/operator/tenants/$TENANT_ID/execution-manifests/$MANIFEST_ID/meta-write-validation-protocols" \
            -d '{}' > /tmp/protocol.json
          node -e "const x=require('/tmp/protocol.json');if(!x.metaWriteValidationProtocolId)throw new Error('missing_protocol');if(!['prepared_external_validation_required','external_validation_succeeded'].includes(x.status))throw new Error('unexpected_protocol:'+x.status);if(x.boundaries?.externalWritesAllowed!==false)throw new Error('unsafe_prepared_protocol')"
          PROTOCOL_STATUS=$(node -e "process.stdout.write(require('/tmp/protocol.json').status)")
          echo "PROTOCOL_STATUS=$PROTOCOL_STATUS" >> "$GITHUB_ENV"

      - name: Request and approve short PAUSED_ONLY execution authorization
        if: env.PROTOCOL_STATUS != 'external_validation_succeeded'
        run: |
          set -euo pipefail
          H="Authorization: Bearer $OPERATOR_TOKEN"
          J="Content-Type: application/json"
          curl --fail --silent --show-error -H "$H" -H "$J" -X POST \
            "$BASE_URL/operator/tenants/$TENANT_ID/execution-manifests/$MANIFEST_ID/authorizations" \
            -d '{}' > /tmp/auth-request.json
          EXEC_AUTH_ID=$(node -e "const x=require('/tmp/auth-request.json');if(!x.executionAuthorizationId)throw new Error('missing_execution_authorization');if(!['pending','approved'].includes(x.status))throw new Error('unexpected_auth_status:'+x.status);if(!(x.scope||[]).includes('intended_lifecycle_status:PAUSED'))throw new Error('authorization_not_paused_only');if(x.boundaries?.effectiveExecutionPermission!==false||x.boundaries?.externalWritesAllowed!==false)throw new Error('authorization_request_unsafe');process.stdout.write(x.executionAuthorizationId)")
          EXEC_AUTH_STATUS=$(node -e "process.stdout.write(require('/tmp/auth-request.json').status)")
          echo "EXEC_AUTH_ID=$EXEC_AUTH_ID" >> "$GITHUB_ENV"

          if [ "$EXEC_AUTH_STATUS" = "approved" ]; then
            cp /tmp/auth-request.json /tmp/auth-approved.json
          else
            curl --fail --silent --show-error -H "$H" -H "$J" -X POST \
              "$BASE_URL/operator/tenants/$TENANT_ID/execution-authorizations/$EXEC_AUTH_ID/approve" \
              -d '{}' > /tmp/auth-approved.json
          fi
          node -e "const x=require('/tmp/auth-approved.json');if(x.status!=='approved')throw new Error('execution_authorization_not_approved:'+x.status);if(!(x.scope||[]).includes('intended_lifecycle_status:PAUSED'))throw new Error('approved_auth_not_paused_only');if(x.boundaries?.effectiveExecutionPermission!==false||x.boundaries?.externalWritesAllowed!==false)throw new Error('execution_auth_approval_unsafe')"

      - name: Run fail-closed preflight
        if: env.PROTOCOL_STATUS != 'external_validation_succeeded'
        run: |
          set -euo pipefail
          H="Authorization: Bearer $OPERATOR_TOKEN"
          J="Content-Type: application/json"
          curl --fail --silent --show-error -H "$H" -H "$J" -X POST \
            "$BASE_URL/operator/tenants/$TENANT_ID/execution-authorizations/$EXEC_AUTH_ID/preflights" \
            -d '{}' > /tmp/preflight.json
          node -e "const x=require('/tmp/preflight.json');if(!Array.isArray(x.blockers))throw new Error('preflight_blockers_missing');if(x.blockers.length)throw new Error('PREFLIGHT_BLOCKED:'+x.blockers.join(','));for(const c of x.checks||[])if(c.status!=='passed')throw new Error('preflight_check_blocked:'+c.key);const b=x.boundaries||{};for(const k of ['externalAttemptStarted','campaignPublished','campaignActive','campaignDelivering','externalWritesAllowed','externalWritesPerformed'])if(b[k]!==false)throw new Error('unsafe_preflight:'+k)"

      - name: Execute exactly one controlled PAUSED_ONLY attempt
        if: env.PROTOCOL_STATUS != 'external_validation_succeeded'
        run: |
          set -euo pipefail
          H="Authorization: Bearer $OPERATOR_TOKEN"
          J="Content-Type: application/json"
          curl --fail --silent --show-error -H "$H" -H "$J" -X POST \
            "$BASE_URL/operator/tenants/$TENANT_ID/execution-authorizations/$EXEC_AUTH_ID/execute-paused" \
            -d '{}' > /tmp/result.json

      - name: Reuse already validated protocol
        if: env.PROTOCOL_STATUS == 'external_validation_succeeded'
        run: cp /tmp/protocol.json /tmp/result.json

      - name: Prove final PAUSED state and close write gate
        run: |
          set -euo pipefail
          node <<'NODE'
          const x=require('/tmp/result.json');
          const operations=x.execution?.operations||[];
          const summarized=operations.map(o=>({objectType:o.objectType,status:o.status,observedStatus:o.observedStatus,externalObjectId:o.externalObjectId}));
          if(x.status!=='external_validation_succeeded') {
            console.log(JSON.stringify({PILOT_PAUSED_ONLY:'STOPPED',protocolStatus:x.status,operations:summarized,boundaries:x.boundaries},null,2));
            throw new Error(`PAUSED_ONLY execution did not succeed: ${x.status}`);
          }
          for(const o of operations) {
            if(o.status!=='succeeded') throw new Error(`Operation not succeeded: ${o.objectType}:${o.status}`);
            if(o.objectType!=='creative' && o.observedStatus!=='PAUSED') throw new Error(`Non-PAUSED object observed: ${o.objectType}:${o.observedStatus}`);
          }
          const b=x.boundaries||{};
          if(b.realMetaWriteValidated!==true) throw new Error('Real Meta write was not validated');
          if(b.externalWritesAllowed!==false) throw new Error('Write gate remained open after completion');
          console.log(JSON.stringify({
            PILOT_PAUSED_ONLY:'SUCCEEDED',
            protocolStatus:x.status,
            objectCount:operations.length,
            operations:summarized,
            safety:{allDeliveryObjectsPaused:true,publicationAuthorized:false,activationAuthorized:false,spendAuthorized:false,deliveryStarted:false,externalWritesAllowedAfterCompletion:b.externalWritesAllowed},
          },null,2));
          NODE
