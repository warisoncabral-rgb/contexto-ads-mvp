name: Frontend validation

on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend.yml'
  push:
    branches:
      - agent/hosted-meta-oauth-validation
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
