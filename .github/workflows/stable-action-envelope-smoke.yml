name: Stable Action Envelope Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/stable-action-envelope-smoke.txt'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://contexto-ads-validation-api.onrender.com/v1
      OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
      CANONICAL_PACKAGE_ID: 849547ce-645e-4c7b-a844-451182253fe6
    steps:
      - name: Require stable operator secret
        shell: bash
        run: test -n "$OPERATOR_TOKEN"

      - name: Wait for v1.0.7 recovery envelope
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            CODE=$(curl --max-time 45 --silent --show-error -o /tmp/recovery.json -w '%{http_code}' \
              -H "Authorization: Bearer $OPERATOR_TOKEN" \
              "$BASE_URL/operator/campaign-packages/v1/$CANONICAL_PACKAGE_ID/action-status" || true)
            echo "recovery attempt $attempt: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/recovery.json | jq .
              if jq -e '.action_status == "NOT_FOUND" and .http_status == 404 and .boundaries.publication_authorized == false and .boundaries.external_writes_allowed == false and .boundaries.external_writes_performed == false and .boundaries.meta_write_performed == false' /tmp/recovery.json >/dev/null; then
                exit 0
              fi
              echo 'HTTP 200 returned but v1.0.7 envelope not ready yet.'
            fi
            sleep 15
          done
          cat /tmp/recovery.json || true
          exit 1

      - name: Verify rejected submit is readable and non-persisting
        shell: bash
        run: |
          set -euo pipefail
          TEST_ID=$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )
          cat > /tmp/invalid.json <<JSON
          {
            "package_id": "$TEST_ID",
            "business_name": "Rosa VIP Calçados"
          }
          JSON
          CODE=$(curl --max-time 45 --silent --show-error -o /tmp/submit.json -w '%{http_code}' \
            -X POST "$BASE_URL/operator/campaign-packages/v1/action-submit" \
            -H "Authorization: Bearer $OPERATOR_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/invalid.json)
          echo "submit envelope HTTP $CODE"
          cat /tmp/submit.json | jq .
          test "$CODE" = "200"
          jq -e '.action_status == "REJECTED" and .http_status >= 400 and .boundaries.publication_authorized == false and .boundaries.external_writes_allowed == false and .boundaries.external_writes_performed == false and .boundaries.meta_write_performed == false' /tmp/submit.json >/dev/null

          RECOVERY_CODE=$(curl --max-time 45 --silent --show-error -o /tmp/test-recovery.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPERATOR_TOKEN" \
            "$BASE_URL/operator/campaign-packages/v1/$TEST_ID/action-status")
          echo "invalid test package recovery HTTP $RECOVERY_CODE"
          cat /tmp/test-recovery.json | jq .
          test "$RECOVERY_CODE" = "200"
          jq -e '.action_status == "NOT_FOUND"' /tmp/test-recovery.json >/dev/null

      - name: Confirm no Meta execution
        shell: bash
        run: echo 'Action envelope smoke only; no Meta execution, publication, activation or spend endpoint called.'
