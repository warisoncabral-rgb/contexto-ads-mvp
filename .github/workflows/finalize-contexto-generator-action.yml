name: Finalize Contexto Generator Action

on:
  push:
    branches: [main]
    paths:
      - .github/finalize-contexto-generator-action.trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Freeze GPT Action on stable API and remove deploy triggers
        run: |
          set -euo pipefail
          OLD='https://contexto-ads-integration-candidate-api.onrender.com/v1'
          NEW='https://contexto-ads-validation-api.onrender.com/v1'
          sed -i "s#${OLD}#${NEW}#g" backend/docs/contexto-ads-generator-action.gpt.openapi.json
          sed -i "s#${OLD}#${NEW}#g" backend/docs/contexto-ads-generator-action.gpt.openapi.yaml
          rm -f backend/.deploy-trigger-contexto-generator-v1
          rm -f backend/.deploy-trigger-contexto-generator-v1-final
          rm -f .github/finalize-contexto-generator-action.trigger
          rm -f .github/workflows/finalize-contexto-generator-action.yml
          if grep -R "${OLD}" backend/docs/contexto-ads-generator-action.gpt.openapi.json backend/docs/contexto-ads-generator-action.gpt.openapi.yaml; then
            echo 'Candidate URL still present in canonical GPT Action contracts.'
            exit 1
          fi
          grep -n "${NEW}" backend/docs/contexto-ads-generator-action.gpt.openapi.json backend/docs/contexto-ads-generator-action.gpt.openapi.yaml
      - name: Commit final freeze
        run: |
          set -euo pipefail
          git config user.name 'contexto-ads-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: freeze Contexto Ads Action on stable API'
          git push origin main
