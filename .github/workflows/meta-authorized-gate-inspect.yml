name: Meta Authorized Gate Inspect

on:
  workflow_dispatch:
  push:
    paths:
      - .github/triggers/meta-authorized-gate-inspect.txt

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://contexto-ads-validation-api.onrender.com/v1
      TENANT_ID: 22222222-2222-4222-8222-222222222222
      CAMPAIGN_ID: b8f16916-cf4c-4e80-894e-dcc56fbd9564
      EXECUTION_PLAN_ID: 90e39a0f-3cbc-4405-80c0-31045af22550
      EXPECTED_PLAN_HASH: 3b2e27a82f9507c2c148f876287a28121ebec327d65714a1b387bf27c0ef893e
      OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
    steps:
      - name: Inspect exact authorized gate
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $OPERATOR_TOKEN")
          curl --fail --silent --show-error "${auth[@]}" \
            "$BASE_URL/operator/tenants/$TENANT_ID/plans" | tee /tmp/plans.json
          curl --fail --silent --show-error "${auth[@]}" \
            "$BASE_URL/operator/tenants/$TENANT_ID/campaigns/$CAMPAIGN_ID/timeline?executionPlanId=$EXECUTION_PLAN_ID" | tee /tmp/timeline.json
          curl --fail --silent --show-error "${auth[@]}" \
            "$BASE_URL/operator/tenants/$TENANT_ID/plans/$EXECUTION_PLAN_ID/readiness" | tee /tmp/readiness.json
          curl --fail --silent --show-error "${auth[@]}" \
            "$BASE_URL/operator/tenants/$TENANT_ID/campaigns/$CAMPAIGN_ID/creative-packages/latest" | tee /tmp/creative.json
          node <<'NODE'
          const fs=require('fs');
          const plans=JSON.parse(fs.readFileSync('/tmp/plans.json','utf8'));
          const arr=Array.isArray(plans)?plans:(plans.plans??plans.items??[]);
          const plan=arr.find(p=>p.executionPlanId===process.env.EXECUTION_PLAN_ID);
          if(!plan) throw new Error('Exact execution plan not found');
          if(plan.planHash!==process.env.EXPECTED_PLAN_HASH) throw new Error('Plan hash mismatch');
          const timeline=JSON.parse(fs.readFileSync('/tmp/timeline.json','utf8'));
          const readiness=JSON.parse(fs.readFileSync('/tmp/readiness.json','utf8'));
          const creative=JSON.parse(fs.readFileSync('/tmp/creative.json','utf8'));
          console.log('\n--- GATE SUMMARY ---');
          console.log(JSON.stringify({plan,timeline,readiness,creative},null,2));
          NODE
