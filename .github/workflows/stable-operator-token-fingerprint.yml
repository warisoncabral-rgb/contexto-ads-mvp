name: Stable Operator Token Fingerprint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/stable-operator-token-fingerprint.txt'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Print non-reversible SHA256 fingerprint only
        env:
          OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OPERATOR_TOKEN"
          node - <<'NODE'
          const crypto=require('crypto');
          const token=process.env.OPERATOR_TOKEN;
          console.log('STABLE_OPERATOR_TOKEN_SHA256='+crypto.createHash('sha256').update(token).digest('hex'));
          NODE
