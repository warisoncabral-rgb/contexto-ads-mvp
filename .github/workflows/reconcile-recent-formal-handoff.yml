name: Reconcile Recent Formal Handoff

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/reconcile-recent-formal-handoff.txt'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://contexto-ads-validation-api.onrender.com/v1
      OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
      TENANT_ID: 22222222-2222-4222-8222-222222222222
      GPT_PACKAGE_ID: b995d1c2-f5da-4cdd-8a8d-b87e8605ed6b
    steps:
      - name: Read GPT-persisted package and creative package only
        shell: bash
        run: |
          set -euo pipefail
          echo '--- GPT PACKAGE STATUS ---'
          curl --max-time 60 --fail --silent --show-error \
            -H "Authorization: Bearer $OPERATOR_TOKEN" \
            "$BASE_URL/operator/tenants/$TENANT_ID/campaign-packages/v1/$GPT_PACKAGE_ID/status" | jq .
          echo '--- LATEST CREATIVE PACKAGE ---'
          curl --max-time 60 --fail --silent --show-error \
            -H "Authorization: Bearer $OPERATOR_TOKEN" \
            "$BASE_URL/operator/tenants/$TENANT_ID/campaigns/$GPT_PACKAGE_ID/creative-packages/latest" | jq .
          echo 'Read-only reconciliation complete; no Meta endpoint called.'
