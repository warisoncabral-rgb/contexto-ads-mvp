name: Ecosystem Real Media Pilot Candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/ecosystem-real-media-pilot-candidate.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://contexto-ads-validation-api.onrender.com/v1
      OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
      CAMPAIGN_ID: 0fc65970-05f1-4258-a28e-a6c411e9f676
    steps:
      - name: Read human candidate status
        run: |
          set -euo pipefail
          H="Authorization: Bearer $OPERATOR_TOKEN"
          curl --fail --silent --show-error -H "$H" "$BASE_URL/operator/ecosystem/campaigns/$CAMPAIGN_ID" > /tmp/human.json
          curl --fail --silent --show-error -H "$H" "$BASE_URL/operator/portfolio" > /tmp/portfolio.json
          node <<'NODE'
          const h=require('/tmp/human.json'); const p=require('/tmp/portfolio.json');
          const item=(p.items||[]).find(i=>i.campaignId===process.env.CAMPAIGN_ID)||{};
          console.log(JSON.stringify({
            REAL_MEDIA_PILOT_CANDIDATE:'READ_ONLY',
            human:{stage:h.stage,headline:h.headline,simpleMessage:h.simpleMessage,whatSystemDid:h.whatSystemDid,nextStep:h.nextStep,userActionRequired:h.userActionRequired,userAction:h.userAction},
            technical:{tenantId:item.tenantId,executionPlanId:h.technicalDetails?.executionPlanId,creativeStatus:h.technicalDetails?.creativeStatus,targetBindingStatus:h.technicalDetails?.targetBindingStatus,planApprovalStatus:h.technicalDetails?.planApprovalStatus,packageNextAction:h.technicalDetails?.packageNextAction,trackingRegistered:h.technicalDetails?.trackingRegistered},
            boundaries:h.boundaries,
          },null,2));
          NODE
