name: Meta Final Plan Snapshot

on:
  push:
    paths:
      - '.github/triggers/meta-final-plan-snapshot.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://contexto-ads-validation-api.onrender.com/v1
      TENANT_ID: 22222222-2222-4222-8222-222222222222
      EXECUTION_PLAN_ID: 90e39a0f-3cbc-4405-80c0-31045af22550
      OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
    steps:
      - name: Read exact execution plan
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $OPERATOR_TOKEN" \
            "$BASE_URL/operator/tenants/$TENANT_ID/plans" | tee /tmp/plans.json
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/plans.json','utf8'));
          const candidates = Array.isArray(data) ? data : (data.plans ?? data.items ?? []);
          const plan = candidates.find(p => p.executionPlanId === process.env.EXECUTION_PLAN_ID);
          if (!plan) { console.error('Exact execution plan not found'); process.exit(4); }
          const counts={campaign:0,ad_set:0,creative:0,ad:0};
          for (const o of plan.objectsToCreate ?? []) if (o?.type in counts) counts[o.type]++;
          console.log(JSON.stringify({
            executionPlanId: plan.executionPlanId,
            campaignId: plan.campaignId,
            planHash: plan.planHash,
            planVersion: plan.planVersion,
            status: plan.status,
            target: plan.meta,
            objectCounts: counts,
            objectTotal: Object.values(counts).reduce((a,b)=>a+b,0),
            financials: plan.financials,
            autonomy: plan.autonomy,
            externalEffects: plan.externalEffects
          }, null, 2));
          NODE
