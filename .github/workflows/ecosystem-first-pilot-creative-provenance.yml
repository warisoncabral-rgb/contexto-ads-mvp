name: Ecosystem First Pilot Creative Provenance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/ecosystem-first-pilot-creative-provenance.txt'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://contexto-ads-validation-api.onrender.com/v1
      OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
      TENANT_ID: 22222222-2222-4222-8222-222222222222
      CAMPAIGN_ID: 09cec7fc-77d0-47ae-9c77-f6250f7bd0c8
    steps:
      - name: Read creative provenance only
        run: |
          set -euo pipefail
          H="Authorization: Bearer $OPERATOR_TOKEN"
          curl --fail --silent --show-error -H "$H" \
            "$BASE_URL/operator/tenants/$TENANT_ID/campaigns/$CAMPAIGN_ID/creative-packages/latest" > /tmp/creative.json
          node <<'NODE'
          const x=require('/tmp/creative.json');
          const scrub=(v)=>{
            if(Array.isArray(v)) return v.map(scrub);
            if(v&&typeof v==='object') return Object.fromEntries(Object.entries(v).map(([k,val])=>{
              if(/primaryText|headline|description|whatsappMessage|text|copy/i.test(k)) return [k, typeof val==='string' ? `[text:${val.length}]` : scrub(val)];
              return [k,scrub(val)];
            }));
            return v;
          };
          console.log(JSON.stringify({CREATIVE_PROVENANCE:'READ_ONLY',creative:scrub(x)},null,2));
          NODE
