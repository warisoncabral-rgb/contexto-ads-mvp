name: Backend PostgreSQL validation

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend-postgres.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: contexto_ads
          POSTGRES_PASSWORD: contexto_ads
          POSTGRES_DB: contexto_ads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contexto_ads -d contexto_ads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://contexto_ads:contexto_ads@localhost:5432/contexto_ads_test
      DATABASE_URL: postgresql://contexto_ads:contexto_ads@localhost:5432/contexto_ads_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm test
      - run: npm run build
