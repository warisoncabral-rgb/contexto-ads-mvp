name: Stable Body Recovery Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stable-action-recovery-post-body.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://contexto-ads-validation-api.onrender.com/v1
      OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
      PACKAGE_ID: 849547ce-645e-4c7b-a844-451182253fe6
    steps:
      - name: Require stable operator secret
        run: test -n "$OPERATOR_TOKEN"

      - name: Wait for body-based recovery route
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            CODE=$(curl --max-time 45 --silent --show-error \
              -D /tmp/recovery.headers \
              -o /tmp/recovery.json \
              -w '%{http_code}' \
              -H "Authorization: Bearer $OPERATOR_TOKEN" \
              -H 'Content-Type: application/json' \
              -X POST \
              --data "{\"package_id\":\"$PACKAGE_ID\"}" \
              "$BASE_URL/operator/campaign-packages/v1/action-status" || true)
            echo "body recovery attempt $attempt: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              cat /tmp/recovery.json | jq .
              grep -qi '^content-type: application/json' /tmp/recovery.headers
              jq -e --arg package_id "$PACKAGE_ID" '
                .action_status == "NOT_FOUND" and
                .http_status == 404 and
                .error.code == "campaign_package_not_found" and
                .error.packageId == $package_id and
                .boundaries.publication_authorized == false and
                .boundaries.external_writes_allowed == false and
                .boundaries.external_writes_performed == false and
                .boundaries.meta_write_performed == false
              ' /tmp/recovery.json >/dev/null
              exit 0
            fi
            if [ "$attempt" = "24" ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Confirm no Meta execution
        run: echo 'Recovery-only smoke; no campaign submit, Meta execution, publication, activation or spend endpoint called.'
