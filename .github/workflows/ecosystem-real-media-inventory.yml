name: Ecosystem Real Media Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/ecosystem-real-media-inventory.txt'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://contexto-ads-validation-api.onrender.com/v1
      OPERATOR_TOKEN: ${{ secrets.CONTEXT_ADS_STABLE_OPERATOR_TOKEN }}
    steps:
      - name: Inventory creative media references
        run: |
          set -euo pipefail
          node <<'NODE'
          const base=process.env.BASE_URL;
          const headers={Authorization:`Bearer ${process.env.OPERATOR_TOKEN}`};
          async function get(path){
            const r=await fetch(`${base}${path}`,{headers});
            if(!r.ok) return {http:r.status};
            return r.json();
          }
          (async()=>{
            const portfolio=await get('/operator/portfolio');
            if(portfolio.http) throw new Error(`portfolio_http_${portfolio.http}`);
            const out=[];
            for(const item of portfolio.items||[]){
              const x=await get(`/operator/tenants/${item.tenantId}/campaigns/${item.campaignId}/creative-packages/latest`);
              if(x.http){out.push({campaignId:item.campaignId,http:x.http});continue;}
              out.push({
                campaignId:item.campaignId,
                status:x.status,
                version:x.version,
                assets:(x.assets||[]).map(a=>({assetId:a.assetId,mimeType:a.mimeType,storageRef:a.storageRef,sha256:a.sha256?`${a.sha256.slice(0,8)}…`:null,width:a.width,height:a.height})),
              });
            }
            console.log(JSON.stringify({
              REAL_MEDIA_INVENTORY:'READ_ONLY',
              campaigns:out,
              httpsMedia:out.filter(i=>(i.assets||[]).some(a=>/^https:\/\//.test(a.storageRef||''))).map(i=>i.campaignId),
            },null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
